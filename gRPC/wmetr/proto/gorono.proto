syntax = "proto3";

package gorono;

option go_package = "gorono/proto";


message  GMetr  {
	string  ID      = 1; 
	string  MType   = 2;    
	int64   Delta   = 3;
	double  Value   = 4;
}

message MBunch {
    repeated GMetr bunch = 1;
}

message BunchResponse {
  string error = 1; // ошибка
  string outData = 2;
}

service Metric {
  rpc AddBunch(MBunch) returns (BunchResponse);

}